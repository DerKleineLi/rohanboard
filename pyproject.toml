[project]
name = "rohanboard"
version = "0.1.0"
description = "Terminal dashboard for a SLURM cluster — jobs, nodes, storage, utilization"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Haoxuan Li", email = "haoxuan.li@tum.de"},
]
keywords = ["slurm", "cluster", "dashboard", "tui", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "asyncssh>=2.22.0",
    "textual>=0.80",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/DerKleineLi/rohanboard"
Issues = "https://github.com/DerKleineLi/rohanboard/issues"

[project.scripts]
rohanboard = "rohanboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rohanboard"]

[dependency-groups]
dev = [
    "textual-dev>=1.5",
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
# Mark async-def tests automatically — saves an `@pytest.mark.asyncio` per
# test in tests/test_exec.py and elsewhere.
asyncio_mode = "auto"
