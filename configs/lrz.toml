# rohanboard config for LRZ AI Systems (BayernKI).
#
# Usage:
#   uv run rohanboard --config configs/lrz.toml
#
# Notes (per ~/.claude/projects/-home-hli/memory/cluster_lrz.md):
# - exec MUST be ssh:lrz; the alias is configured in ~/.ssh/config with
#   ProxyJump through lrzlogin (cold connection ≈ 10.5 s).
# - LRZ login node does NOT have the `quota` binary. Use:
#     - kind = "dssusrinfo" mode = "home" for /dss/dsshome1 (per-user)
#     - kind = "dssusrinfo" mode = "container" for MCML DSS (project-shared)
#     - kind = "df" for the scratch fs (dssusrinfo doesn't cover scratch
#       — it's not a DSS container; df gives filesystem-aggregate)
#   `dssusrinfo` lives at /usr/local/bin/dssusrinfo on LRZ login. The two
#   subcommands the dashboard uses are `dsshome` (home dir) and
#   `container_usage` (project containers). See Phase 4d.2-C in
#   CLAUDE_README for the parser contract.
# - Storage paths use the FILESYSTEM MOUNT roots (e.g. /dss/dsshome1),
#   not the user-specific subdirs. df -B1 resolves either to the same
#   filesystem row, but the v2 combined collector's label-override
#   mapping requires the config path to match df's "Mounted on" column
#   exactly — and df reports the mount root, not the subpath.
# - users = ["self"] resolves to the REMOTE `whoami` (e.g. "di35dob" on
#   LRZ) — see exec.py::resolve_whoami. Configs are PII-free and safe
#   to commit / share.
# - [refresh] slurm_jobs bumped to 15 s so the first refresh tick doesn't
#   cancel mid-handshake on the cold ProxyJump (~10.5 s).
# - No [layout] / [overview] — Phase 4d.1 Task B made the rohan-style
#   layout the default for any single-cluster TOML.

exec = "ssh:lrz"

[slurm]
users = ["self"]

[refresh]
slurm_jobs = 15
slurm_nodes = 30
storage = 60

[[storage.entries]]
label = "home"
kind = "dssusrinfo"
mode = "home"
path = "/dss/dsshome1"
group = "home"

[[storage.entries]]
label = "scratch ($MCMLSCRATCH)"
kind = "df"
path = "/dss/mcmlscratch"
group = "scratch"

[[storage.entries]]
label = "MCML DSS (pn25pi-dss-0000)"
kind = "dssusrinfo"
mode = "container"
container = "pn25pi-dss-0000"
path = "/dss/dssmcmlfs01"
group = "persistent"
